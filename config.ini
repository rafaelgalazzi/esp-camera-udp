# INI estrito: chaves desconhecidas causam erro para evitar configuracoes ignoradas.
[udp]
host=0.0.0.0
port=5000
frame_timeout_ms=100
[http]
host=127.0.0.1
port=8080
[discovery]
port=5001
auto_pair=true
state_file=pairings.txt
[stream]
max_fps=90
[monitoring]
stats_interval_seconds=5
offline_ms=3000
log_level=INFO

# Copie o ID exibido no terminal e reinicie a ponte para atribuir papeis.
# O endpoint deve coincidir com o persistido em pairings.txt, ou ser alterado
# junto com os outros endpoints para manter a unicidade.
# [camera.000012345678abcd]
# endpoint=1
# role=left_eye
