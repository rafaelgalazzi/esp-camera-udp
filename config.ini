# Strict INI: unknown keys are errors to prevent silently ignored settings.
[udp]
host=0.0.0.0
port=5000
frame_timeout_ms=100
[http]
host=127.0.0.1
port=8080
[discovery]
port=5001
auto_pair=true
state_file=pairings.txt
[stream]
max_fps=90
[monitoring]
stats_interval_seconds=5
offline_ms=3000
log_level=INFO

# Copy the ID shown in the terminal and restart the bridge to assign roles.
# The endpoint must match the value saved in pairings.txt, or be changed
# together with the other endpoints to keep all assignments unique.
# [camera.000012345678abcd]
# endpoint=1
# role=left_eye
