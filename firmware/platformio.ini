[platformio]
default_envs = xiao_esp32s3_ov2640
extra_configs = platformio.local.ini

[env:xiao_esp32s3_ov2640]
platform = espressif32@6.13.0
platform_packages =
    platformio/framework-espidf@4.50505.0
    platformio/toolchain-xtensa-esp-elf@14.2.0+20260121
    platformio/toolchain-riscv32-esp@14.2.0+20241119
board = seeed_xiao_esp32s3
framework = espidf
extra_scripts =
    pre:pio_compat.py
    pre:wifi_config.py
    post:merge_firmware.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.partitions = partitions.csv
